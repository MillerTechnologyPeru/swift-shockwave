name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Swift tests (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - name: Install SDL3
        run: brew install sdl3
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: swift test
